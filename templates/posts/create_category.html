{% extends "posts/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>🏷️ {{ title }}</h1>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
                <small style="color: #e74c3c;">{{ field.errors|striptags }}</small>
            {% endif %}
        </div>
        {% endfor %}
        <div class="actions">
            <button type="submit" class="btn btn-success">💾 Добавить</button>
            <a href="{% url 'post_list' %}" class="btn" style="background: #95a5a6; color: white;">↩️ Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
