{% extends 'base.html' %}

{% block title %}
<title>Создать категорию | Блог</title>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h3 class="mb-3">Создать категорию</h3>
                    <form method="post" action="{% url 'create_category' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name" class="form-label">Название категории</label>
                            <input type="text" name="name" id="name" class="form-control" required maxlength="200">
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                            <a href="{% url 'create_post' %}" class="btn btn-outline-secondary">Назад</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
